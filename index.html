<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>遊戲情報雷達</title>
<style>
:root{--bg:#eef2f6;--row:#fff;--tx:#14233b;--mu:#5b6b82;--ac:#2457c5;--ln:#d5dce6;--free:#0f766e;--og:#17803d;--np:#d92d20;--pl:36%;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#101722;--row:#182234;--tx:#e6edf7;--mu:#93a3ba;--ac:#7aa2ff;--ln:#2a3850;--free:#5eead4;--og:#4ade80;--np:#ff7a70;--pl:62%}}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
main{max-width:1240px;margin:0 auto;padding:clamp(16px,3vw,28px) clamp(12px,3vw,24px) calc(48px + env(safe-area-inset-bottom,0px))}
@supports(padding:max(0px)){main{padding-left:max(clamp(12px,3vw,24px),env(safe-area-inset-left));padding-right:max(clamp(12px,3vw,24px),env(safe-area-inset-right))}}
h1{margin:0;font-size:clamp(22px,2.4vw + 14px,32px);letter-spacing:.02em}
#upd{color:var(--mu);font-size:14px;margin:2px 0 22px}
[role=tablist]{display:flex;gap:clamp(14px,3vw,24px);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:5;background:var(--bg);overflow-x:auto;white-space:nowrap;scrollbar-width:none}[role=tablist]::-webkit-scrollbar{display:none}
[role=tab]{font:inherit;background:none;border:0;border-bottom:3px solid transparent;color:var(--mu);padding:8px 0;cursor:pointer;margin-bottom:-1px;flex:none}
[role=tab][aria-selected=true]{color:var(--tx);border-color:var(--ac);font-weight:700}
#chips{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
#chips button{font:inherit;font-size:14px;background:none;border:1px solid var(--ln);color:var(--mu);border-radius:6px;padding:2px 12px;cursor:pointer}
#chips button[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:#fff}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:10px;align-items:stretch;margin-top:10px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;position:relative;padding-left:5px;align-content:start;background:var(--row);border-radius:6px;overflow:hidden;min-width:0;max-width:100%}
.item i{background:#888;position:absolute;left:0;top:0;bottom:0;width:5px}.item[data-p=Steam] i{background:#2a6f97}.item[data-p=Epic] i{background:#6b6b80}.item[data-p=EA] i{background:#d1393b}
.item[data-p=Nintendo] i{background:#e60012}.item[data-p=PlayStation] i{background:#1f4fd8}.item[data-p=Xbox] i{background:#107c10}.item[data-p=PC] i{background:#7a5af5}.item[data-p=iOS] i{background:#8e8e93}.item[data-p=Android] i{background:#2fa84f}
.item>div{padding:10px 14px;min-width:0;overflow-wrap:anywhere}.item>.dt{grid-column:1 / -1;padding:0 14px 12px}.item a{color:var(--tx);text-decoration:none;font-weight:600}.item a:hover{color:var(--ac);text-decoration:underline}
.m{font-size:14px;color:var(--mu)}.free{color:var(--free);font-weight:600}
details{margin-top:0;min-width:0;max-width:100%}summary{cursor:pointer;color:var(--ac);font-size:14px}
.shots{display:flex;gap:6px;overflow-x:auto;max-width:100%;margin:8px 0;padding-bottom:4px;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}.shots img{flex:none;scroll-snap-align:start;height:clamp(72px,18vw,110px);border-radius:4px;display:block}
video{width:100%;max-width:480px;border-radius:6px;margin:6px 0;background:#000}
.rv{border-left:3px solid var(--ln);padding-left:10px;margin:8px 0;font-size:14px}.rv b{font-weight:600}.rv .m{margin-top:2px}
.ok{color:var(--free)}svg.ch{width:100%;max-width:360px;height:auto;display:block;margin:6px 0}svg.ch path{fill:none;stroke:var(--ac);stroke-width:2}
h4{margin:12px 0 2px;font-size:14px}
.cv.sq{object-fit:contain}.pis{display:inline-flex;gap:4px;vertical-align:middle;margin-right:6px}.pi{display:inline-block;width:22px;height:22px;border-radius:5px;overflow:hidden;line-height:0}.pi svg,.pi img{width:100%;height:100%;display:block;object-fit:contain}.pi.ep{background:#fff;border:1px solid var(--ln);box-sizing:border-box}.pi.ep img{padding:2px;box-sizing:border-box}.low{color:var(--mu)}.nw{white-space:nowrap}
.lowtag{display:inline-block;background:var(--np);color:#fff;border-radius:4px;padding:0 6px;font-size:12px;font-weight:600;white-space:nowrap}.lowtag.near{background:none;color:var(--np);border:1px solid var(--np)}.m a,.cmp a{font-weight:400;color:var(--ac)}.cmp td:last-child{white-space:nowrap}
.best{display:inline-block;font-size:12px;font-weight:600;color:var(--og);border:1px solid var(--og);border-radius:4px;padding:0 6px;margin-left:4px;max-width:100%}
.tw{overflow-x:auto;max-width:100%}table.cmp{border-collapse:collapse;width:100%;font-size:14px}.cmp td{padding:5px 8px 5px 0;border-bottom:1px solid var(--ln);vertical-align:top}.cmp tr.bst td{background:rgba(23,128,61,.1)}
.pct,.orig,.now{white-space:nowrap}.pct{font-weight:700;font-size:1.08em;margin:0 6px 0 4px}
.orig{color:var(--og);text-decoration:line-through;text-decoration-thickness:2px;margin-right:6px}
.now{color:var(--np);font-weight:700;font-size:1.12em}
.age{display:inline-block;vertical-align:middle;margin-left:8px;width:38px;border:2px solid var(--c,#8a94a6);border-radius:4px;overflow:hidden;background:#fff;text-align:center;line-height:1;font-weight:400}
.age b{display:block;background:var(--c,#8a94a6);color:#fff;font-size:15px;font-weight:700;padding:3px 0 2px}.age sup{font-size:9px;vertical-align:top;margin-left:1px}
.age u{display:block;text-decoration:none;color:#111;font-size:9px;padding:2px 0}
.age[data-a="0"]{--c:#3fa535}.age[data-a="6"]{--c:#00a0e9}.age[data-a="12"]{--c:#f5c800}.age[data-a="12"] b{color:#1a1a1a}.age[data-a="15"]{--c:#f08300}.age[data-a="18"]{--c:#d7000f}
.cvl{align-self:start;margin:10px 10px 10px 0}.cv{width:clamp(96px,22vw,150px);height:auto;aspect-ratio:460/215;object-fit:cover;border-radius:4px;display:block;background:var(--ln)}
@media(min-width:1800px){main{max-width:1560px}}
@media(max-width:380px){.cvl{margin-right:8px}.item>div{padding:8px 10px}.m{font-size:13px}}
@media(pointer:coarse){[role=tab]{padding:12px 0}#chips button{padding:8px 14px}summary{padding:8px 0}}
#msg{color:var(--mu);padding:24px 0}#err{font-size:13px;color:var(--mu);margin-top:28px;border-top:1px solid var(--ln);padding-top:10px}
</style></head><body><main>
<h1>遊戲情報雷達</h1><div id="upd">載入中…</div>
<div role="tablist" id="tabs"></div><div id="chips"></div><div id="list"></div><div id="msg"></div><div id="err"></div><div class="m" style="margin-top:12px">資料來源:Steam、<a href="https://rawg.io" target="_blank" rel="noopener noreferrer">RAWG</a>、各媒體 RSS、<a href="https://www.gamerpower.com" target="_blank" rel="noopener noreferrer">GamerPower</a>(限時免費)、Apple iTunes、Google Play(非官方)、匯率來自 <a href="https://www.exchangerate-api.com" target="_blank" rel="noopener noreferrer">ExchangeRate-API</a>。手機付費榜依評分與評論數綜合排序,iOS 取自 App Store 台灣區付費榜,Android 靠關鍵字搜尋找候選,可能漏掉部分遊戲。史低價是 CheapShark 的美元紀錄換算,僅供參考。分級圖示依 Steam / RAWG 提供的 PEGI、ESRB 資料換算,僅供參考,非台灣官方分級,請以遊戲包裝或文化部公告為準。</div>
<script>
const TABS=[["news","最新消息"],["free","限時免費"],["deals","特價消息"],["new","新上架"],["soon","即將上架"],["mobile","手機付費榜"]];
let D={free:[],deals:[],news:[]},G={apps:{}},H={},tab="free",plat="全部";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=u=>/^https?:\/\//.test(u)?u:"#";
const tw=s=>s?new Date(s).toLocaleString("zh-TW",{timeZone:"Asia/Taipei",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false}):"";

function chart(id,g){
 const pts=H[id]||[],cur=(g.price&&g.price.cur)||"TWD",low=g.low&&g.low.usd?`CheapShark 紀錄的史低:US$${esc(g.low.usd)}(${esc(g.low.date)})`:"";
 if(pts.length<2)return `<div class="m">價格紀錄累積中,目前 ${pts.length} 筆,每天會新增一筆。${low}</div>`;
 const xs=pts.map(p=>new Date(p[0]).getTime()),ys=pts.map(p=>p[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),W=320,T=90;
 const px=x=>x1===x0?0:(x-x0)/(x1-x0)*W,py=y=>y1===y0?T/2:T-5-(y-y0)/(y1-y0)*(T-10);
 const d=pts.map((p,i)=>(i?"L":"M")+px(xs[i]).toFixed(1)+" "+py(ys[i]).toFixed(1)).join("");
 return `<svg class="ch" viewBox="0 0 ${W} ${T}" role="img" aria-label="價格走勢"><path d="${d}"/></svg><div class="m">${esc(pts[0][0])} 至 ${esc(pts[pts.length-1][0])},最低 ${cur} ${y0.toLocaleString()},最高 ${y1.toLocaleString()}。${low}</div>`}
function detail(i){
 const g=G.apps&&G.apps[i.appid];if(!g)return"";
 const r=g.reviews||{},sum=r.total?`${esc(r.label)},${r.pct}% 好評,共 ${r.total.toLocaleString()} 篇`:"尚無評論";
 const shots=(g.shots||[]).map(x=>`<a href="${esc(safe(x.f))}" target="_blank" rel="noopener noreferrer"><img loading="lazy" src="${esc(safe(x.t))}" alt=""></a>`).join("");
 const vid=(g.movies||[]).filter(m=>m.mp4).slice(0,1).map(m=>`<video controls preload="none" poster="${esc(safe(m.thumb))}" src="${esc(safe(m.mp4))}"></video>`).join("");
 const rv=(r.top||[]).map(x=>`<div class="rv">${esc(x.text)}${x.text.length>=220?"…":""}<div class="m"><b class="${x.up?"ok":""}">${x.up?"推薦":"不推薦"}</b>,遊玩 ${x.hours} 小時</div></div>`).join("");
 return `<details><summary>畫面、影片、評論與價格走勢</summary>
 ${g.desc?`<p class="m">${esc(g.desc)}</p>`:""}${shots?`<div class="shots">${shots}</div>`:""}${vid}
 <h4>Steam 評價</h4><div class="m">${sum}${g.metacritic?`;Metacritic ${esc(g.metacritic)}`:""}</div>${rv}
 ${g.price?`<h4>價格走勢</h4>${chart(i.appid,g)}`:""}${cmpHtml(i,g)}</details>`}
function lowChip(i){
 const g=G.apps&&G.apps[i.appid];if(!g||!g.low||!g.low.usd)return"";
 const fx=G.fx||(g.compare&&g.compare.fx);if(!fx)return"";
 const low=Math.round(parseFloat(g.low.usd)*fx),cur=g.price&&g.price.final;
 let tag="";if(cur>0){const r=cur/low;tag=r<=1.02?'<span class="lowtag">目前已是史低</span>':r<=1.15?'<span class="lowtag near">接近史低</span>':""}
 return `<div class="m low" title="依 CheapShark 的美元史低價,用即時匯率換算,實際台灣區史低可能不同">歷史最低 約 NT$ ${low.toLocaleString()} <span class="nw">(US$${esc(g.low.usd)},${esc(g.low.date)})</span> ${tag}</div>`}
const cmpRows=g=>(g&&g.compare&&g.compare.rows)||[];
function bestOf(rows){const v=rows.filter(r=>r.twd>0);return v.length<2?null:v.reduce((a,b)=>b.twd<a.twd?b:a)}
function bestChip(i){
 const b=bestOf(cmpRows(G.apps&&G.apps[i.appid]));if(!b)return"";
 return `<span class="best">${/^Steam/.test(b.store)?"Steam 台灣區已是最低價":"最划算:"+esc(b.store)+" 約 NT$ "+Math.round(b.twd).toLocaleString()+(/iOS|Android/.test(b.store)?"(手機版,內容可能不同)":"")}</span>`}
function cmpHtml(i,g){
 const c=g.compare;if(!c||!c.rows||!c.rows.length)return"";
 const rows=[...c.rows].sort((a,b)=>(a.twd>0?a.twd:1e12)-(b.twd>0?b.twd:1e12)),best=bestOf(rows);
 const tr=rows.map(r=>`<tr${r===best?' class="bst"':""}><td>${esc(r.store)}${r===best?' <b class="ok">最划算</b>':""}${/iOS|Android/.test(r.store)?' <span class="m">手機版</span>':""}</td><td>${r.twd===0?"免費":r.twd>0?(r.usd!=null?"約 ":"")+"NT$ "+Math.round(r.twd).toLocaleString():"—"}${r.usd!=null?` <span class="m">(US$${esc(r.usd)})</span>`:""}</td><td><a href="${esc(safe(r.url))}" target="_blank" rel="noopener noreferrer">前往</a></td></tr>`).join("");
 const nm=encodeURIComponent(c.en||i.title);
 const cons=[["PlayStation","PS5"],["Xbox","Xbox"],["Switch","Nintendo Switch"]].map(([n,q])=>`<a href="https://www.google.com/search?q=${nm}+${encodeURIComponent(q)}+價格" target="_blank" rel="noopener noreferrer">${n}</a>`).join("、");
 return `<h4>各平台價格比較</h4><div class="tw"><table class="cmp">${tr}</table></div><div class="m">美元價格以 1 美元約 ${c.fx?c.fx.toFixed(1):"?"} 台幣估算。第三方商店的金鑰可能有地區限制,手機版內容可能和電腦版不同,價格不含稅與手續費。主機版沒有公開價格資料,請自行搜尋:${cons}</div>`}
function dtBlock(i){const h=i.appid?detail(i):"";return h?`<div class="dt">${h}</div>`:""}
function cover(i){
 if(!i.appid&&!i.image)return"";const g=G.apps&&G.apps[i.appid];
 const src=i.image||(g&&g.header)||`https://cdn.cloudflare.steamstatic.com/steam/apps/${i.appid}/header.jpg`;
 return `<a class="cvl" href="${esc(safe(i.url))}" target="_blank" rel="noopener noreferrer" tabindex="-1" aria-hidden="true"><img class="cv${i.square?" sq":""}" loading="lazy" data-app="${esc(i.appid||"")}" src="${esc(safe(src))}" alt=""></a>`}
const AGE={0:"普遍級",6:"保護級",12:"輔12級",15:"輔15級",18:"限制級"};
function ageBadge(i){
 const g=G.apps&&G.apps[i.appid];let a=i.age;
 if((a===undefined||a===null)&&g&&g.age!==undefined)a=g.age;
 if(a===undefined||a===null)return"";
 return `<span class="age" data-a="${a}" title="${AGE[a]} ${a}+(依 PEGI/ESRB 資料換算,非台灣官方分級)"><b>${a}<sup>+</sup></b><u>${AGE[a]}</u></span>`}
const pl=i=>i.platforms||[i.platform];

const PNAME={"Steam": "Steam", "Epic": "Epic Games Store", "GOG": "GOG", "PC": "Windows PC", "PlayStation": "PlayStation", "Xbox": "Xbox", "Nintendo": "Nintendo Switch", "iOS": "iOS(App Store)", "Android": "Android(Google Play)", "EA": "EA"};
const PK={Steam:"Steam",Epic:"Epic","Epic Games Store":"Epic",EA:"EA",GOG:"GOG",PC:"PC",PlayStation:"PlayStation",Xbox:"Xbox",Nintendo:"Nintendo",iOS:"iOS",Android:"Android"};
const PORD=["Steam","Epic","EA","GOG","PC","PlayStation","Xbox","Nintendo","iOS","Android"];
const icon=k=>`<span class="pi${k==="Epic"?" ep":""}" title="${PNAME[k]}" role="img" aria-label="${PNAME[k]}">${IMG[k]?`<img src="${IMG[k]}" alt="">`:SVG[k]}</span>`;
function platKeys(i){
 const s=new Set();pl(i).forEach(p=>{if(PK[p])s.add(PK[p])});
 if(i.appid)s.add("Steam");
 cmpRows(G.apps&&G.apps[i.appid]).forEach(r=>{const n=r.store;if(/^Steam/.test(n))s.add("Steam");else if(/Epic/.test(n))s.add("Epic");else if(/^GOG/i.test(n))s.add("GOG");else if(/^(Origin|EA)\b/i.test(n))s.add("EA");else if(/iOS/.test(n))s.add("iOS");else if(/Android/.test(n))s.add("Android")});
 return PORD.filter(k=>s.has(k))}
function platLabel(i){const k=platKeys(i);return k.length?`<span class="pis">${k.map(icon).join("")}</span>`:esc(pl(i).join(" / "))+":"}

const dt=i=>((G.apps&&G.apps[i.appid])||{}).release_iso||i.release||"";
function pctColor(p){const t=Math.min(1,Math.max(0,(p-10)/80));return `hsl(${Math.round(125*(1-t))},78%,var(--pl))`}
const money=(c,n)=>c+(/[A-Za-z]$/.test(c)?"\u00a0":"")+n;
function priceHtml(d){
 d=d||"";let m=/^-(\d+)%\s+(\D*?)\s*([\d,.]+)\(原價\s+([\d,.]+)\)$/.exec(d);
 if(m){const p=+m[1],c=m[2].trim();return `<span class="pct" style="color:${pctColor(p)}">-${p}%</span><s class="orig">${esc(money(c,m[4]))}</s><b class="now">${esc(money(c,m[3]))}</b>`}
 m=/^原價\s+(.+)$/.exec(d);if(m)return `<s class="orig">${esc(m[1])}</s><b class="now">免費</b>`;
 if(d==="限時免費")return `<span class="pct" style="color:${pctColor(100)}">-100%</span><b class="now">免費</b>`;
 return esc(d)}
function meta(i){
 if(tab==="mobile")return `<b>#${i.rank}</b> ${esc(i.desc)} ・ <span class="nw">★ ${esc(i.rating)}(${Number(i.count).toLocaleString()} 則評論)</span>`;
 if(tab==="new"||tab==="soon"){const g=G.apps&&G.apps[i.appid];const r=(g&&g.release)||i.release||"";return (tab==="new"?"上架 ":"預計 ")+esc(r||"日期未定")+(i.desc?","+esc(i.desc):"")}
 if(tab==="free"){const n=i.status==="next";return `<span class="free">${n?"即將免費":"免費中"}</span> ${i.start&&n?tw(i.start)+" 起,":""}${i.end?"至 "+tw(i.end)+"(台北時間)":"(限時,結束時間不明)"}${i.desc?" ,"+priceHtml(i.desc):""}`}
 if(tab==="news")return tw(i.date);
 return priceHtml(i.desc)}
function render(){
 $("tabs").innerHTML=TABS.map(([k,v])=>`<button role="tab" aria-selected="${k===tab}" data-t="${k}">${v}</button>`).join("");
 let items=[...(D[tab]||[])];
 if(tab==="news")items.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
 if(tab==="free")items.sort((a,b)=>(a.status==="next")-(b.status==="next"));
 if(tab==="mobile")items.sort((a,b)=>a.platform===b.platform?a.rank-b.rank:(a.platform==="iOS"?-1:1));
 if(tab==="new"||tab==="soon"){const k=x=>dt(x)||(tab==="new"?"0000":"9999");items.sort((a,b)=>tab==="new"?k(b).localeCompare(k(a)):k(a).localeCompare(k(b)))}
 const ps=["全部",...new Set(items.flatMap(pl))];if(!ps.includes(plat))plat="全部";
 $("chips").innerHTML=ps.map(p=>`<button aria-pressed="${p===plat}" data-p="${esc(p)}">${esc(p)}</button>`).join("");
 const show=items.filter(i=>plat==="全部"||pl(i).includes(plat));
 $("list").innerHTML=show.map(i=>`<div class="item" data-p="${esc(pl(i)[0])}"><i></i><div><a href="${esc(safe(i.url))}" target="_blank" rel="noopener noreferrer">${esc(i.title)}</a>${ageBadge(i)}<div class="m">${platLabel(i)}${meta(i)}${bestChip(i)}</div>${lowChip(i)}</div>${cover(i)}${dtBlock(i)}</div>`).join("");
 $("msg").textContent=show.length?"":(D.updated?"這個分類目前沒有資料。":"還沒有資料,請先在 GitHub 的 Actions 頁手動執行一次 update-data。");
}
const shotPick={};
document.addEventListener("error",e=>{
 const im=e.target;if(!(im.classList&&im.classList.contains("cv")))return;
 const g=G.apps&&G.apps[im.dataset.app],c=[];
 if(g&&g.header)c.push(g.header);
 if(g&&g.shots&&g.shots.length){const k=im.dataset.app;if(!shotPick[k])shotPick[k]=g.shots[Math.floor(Math.random()*g.shots.length)];c.push(shotPick[k].t||shotPick[k].f)}
 let st=+im.dataset.st||0;while(c[st]&&c[st]===im.getAttribute("src"))st++;
 const n=c[st];
 if(n&&/^https?:\/\//.test(n)){im.dataset.st=st+1;im.src=n}else{const a=im.closest(".cvl");if(a)a.remove()}},true);
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.t){tab=b.dataset.t;plat="全部"}if(b.dataset.p)plat=b.dataset.p;render();if(b.dataset.t){const a=document.querySelector("[role=tab][aria-selected=true]");if(a)a.scrollIntoView({inline:"center",block:"nearest"})}});
const j=u=>fetch(u+"?_="+Date.now()).then(r=>r.json()).catch(()=>null);
j("games.json").then(g=>{if(g)G=g;render()});j("history.json").then(h=>{if(h)H=h;render()});
fetch("data.json?_="+Date.now()).then(r=>r.json()).then(d=>{D=d;
 $("upd").textContent=d.updated?"最後更新 "+tw(d.updated)+"(台北時間)":"尚未更新";
 $("err").textContent=(d.errors||[]).length?"部分來源暫時抓不到,已顯示舊資料:"+d.errors.map(x=>x.split(":")[0]).join("、"):"";
 render()}).catch(()=>{$("upd").textContent="讀不到 data.json";render()});
render();
</script></main></body></html>
