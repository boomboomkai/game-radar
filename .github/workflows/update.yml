name: update-data
on:
  schedule:
    - cron: "0 */6 * * *"   # 每 6 小時(UTC)
  workflow_dispatch:         # 可在 Actions 頁手動執行
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_data.py
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}   # 選用,沒設定會自動略過
      - run: |
          git config user.name "game-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json games.json history.json
          git diff --cached --quiet || (git commit -m "update data" && git push)
