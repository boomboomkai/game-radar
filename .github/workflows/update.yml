name: update-data
on:
  schedule:
    - cron: "0 */6 * * *"   # 每 6 小時(UTC)
  workflow_dispatch:         # 可在 Actions 頁手動執行

permissions:
  contents: read             # 預設唯讀;只有 commit 那個工作才有寫入權限

concurrency:
  group: update-data         # 同時只跑一個,避免兩次執行互相覆蓋
  cancel-in-progress: false

jobs:
  fetch:                     # 第一段:抓資料。會執行第三方套件,所以沒有寫入權限、也不保留登入憑證
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803   # v6(固定版本編號,避免標籤被改)
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python fetch_data.py
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}   # 選用,沒設定會自動略過
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: data
          path: |
            data.json
            games.json
            history.json
            mobile_prices.json
            android_top.json
          if-no-files-found: warn

  commit:                    # 第二段:只把幾個資料檔存回專案,不執行任何第三方程式
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803   # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4
        with:
          name: data
          path: new-data
      - name: 檢查並更新資料檔
        run: |
          set -e
          # 檢查 JSON 能不能讀(NaN、Infinity 也算壞掉:瀏覽器讀不了)
          ok() { python3 -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'), parse_constant=lambda c: int('bad ' + c))" "$1"; }
          # 三個主要檔案是同一批資料:全部存在且都能讀才一起更新,只要有一個壞掉就整批不更新
          for f in data.json games.json history.json; do
            [ -f "new-data/$f" ] || { echo "缺少 $f,這次不更新"; exit 1; }
            ok "new-data/$f" || { echo "$f 內容壞掉,這次不更新"; exit 1; }
          done
          cp new-data/data.json new-data/games.json new-data/history.json .
          # 手機價格快取是選用的:有而且能讀才更新
          for f in mobile_prices.json android_top.json; do
            if [ -f "new-data/$f" ] && ok "new-data/$f"; then cp "new-data/$f" "$f"; fi
          done
          git config user.name "game-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json games.json history.json mobile_prices.json android_top.json
          git diff --cached --quiet || (git commit -m "update data" && git push)
